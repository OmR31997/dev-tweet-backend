# Render Blueprint — deploy the NestJS API as a long-running web service.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: devtweethub-api
    runtime: node
    rootDir: backend
    plan: free
    # Install devDependencies for `nest build`, then prune before runtime.
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: node dist/main
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: 4000
      - key: HOST
        value: 0.0.0.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: PASSWORD_RESET_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        sync: false
