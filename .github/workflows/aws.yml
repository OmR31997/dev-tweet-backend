name: EC2 CI/CD PIPELINE
on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: 24
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  NODE_OPTIONS: --no-deprecation
  EC2_USER: ${{ secrets.EC2_OS_SYSTEM }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm test

  cd:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: SSH Authentication
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_PUBLIC_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh ${{ env.EC2_USER }}@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
            export APP_NAME="${{ secrets.APP_NAME }}"
            export APP_DIR="$HOME/projects/${{ secrets.APP_NAME }}"
            export BRANCH_NAME="${{ github.ref_name }}"
            export INSTANCE_ID="${{ secrets.INSTANCE_ID }}"
            export SNS_TOPIC_ARN="${{ secrets.SNS_TOPIC_ARN }}"
            bash "$APP_DIR/scripts/deploy.sh"
          EOF

      - name: Push CloudWatch Metric
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-southeast-1
        run: |
          aws cloudwatch put-metric-data \
            --metric-name DeploySuccess \
            --namespace "${{ secrets.APP_NAME }}" \
            --value 1
